services:
  diurn.db.postgres:
    image: postgres:latest
    restart: always
    container_name: diurn.database
    env_file:
      - .env
    volumes:
      - ./.containers/diurn-db:/var/lib/postgresql/data
    build:
      context: .
      dockerfile: Diurn.DB/Dockerfile
    ports:
      - "5433:5432"

  diurn.api:
    container_name: diurn
    env_file:
      - .env
    depends_on:
      - diurn.db.postgres
    build:
      context: .
      dockerfile: Diurn.API/Dockerfile
    ports:
      - "5000:80"
      - "5001:443"
    volumes:
      - ~/.aspnet/https:/https:ro